name: Báo lỗi
description: Ứng dụng chạy sai hoặc bị lỗi
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Phiên bản app
      description: Xem ở Cài đặt > Về app
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Hệ điều hành
      options: [Windows 10, Windows 11, Linux]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước làm để gặp lỗi
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi và kết quả thực tế
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Cài đặt > Công cụ > Mở thư mục log, dán các dòng liên quan.
      render: text
